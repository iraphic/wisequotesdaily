<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Memo Generator (jQuery)</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h2 { margin-bottom: 10px; }
        
        /* Container Canvas */
        .canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #555;
            margin-bottom: 20px;
            max-width: 100%; 
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* Controls */
        .controls {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .full-width { grid-column: span 2; }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        label { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        
        input[type="range"] { width: 100%; cursor: pointer; }
        
        button {
            padding: 12px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-gen { background: #008CBA; color: white; }
        .btn-dl { background: #4CAF50; color: white; }
        .btn-gen:hover { background: #007399; }
        
        /* Loading Indicator */
        #loader {
            display: none;
            color: #ffff00;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Nokia Memo Generator</h2>
    <div id="loader">Sedang mengambil quote via jQuery...</div>

    <div class="canvas-container">
        <canvas id="memeCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="full-width">
            <button class="btn-gen" onclick="generateQuote()">🔄 Generate New Quote</button>
        </div>

        <div class="input-group">
            <label>Posisi Kiri/Kanan (X): <span id="valX">0</span></label>
            <input type="range" id="posX" min="0" max="500" value="25" oninput="updateCanvas()">
        </div>

        <div class="input-group">
            <label>Posisi Atas/Bawah (Y): <span id="valY">0</span></label>
            <input type="range" id="posY" min="0" max="500" value="285" oninput="updateCanvas()">
        </div>

        <div class="input-group">
            <label>Jarak Antar Baris (Line Height): <span id="valLH">0</span></label>
            <input type="range" id="lineH" min="10" max="100" value="56" oninput="updateCanvas()">
        </div>

        <div class="input-group">
            <label>Ukuran Font: <span id="valFS">0</span></label>
            <input type="range" id="fontS" min="10" max="60" value="34" oninput="updateCanvas()">
        </div>
        
        <div class="input-group full-width">
            <label>Lebar Teks (Wrap Width): <span id="valW">0</span></label>
            <input type="range" id="maxW" min="100" max="1000" value="950" oninput="updateCanvas()">
        </div>

        <div class="full-width">
            <button class="btn-dl" onclick="downloadImage()">💾 Download Image</button>
        </div>
    </div>

    <script>
        // CONFIG
        const API_KEY = "9zAnv7rg3z+Re3XeiyrFjg==DQRDaDt5Ln0kQm7w";
        // Catatan: Biasanya endpoint API Ninjas Quotes adalah v1. Saya set ke v1 agar stabil.
        const API_URL = "https://api.api-ninjas.com/v1/quotes"; 
        const CATEGORIES = ['success', 'wisdom', 'life', 'inspirational', 'happiness', 'future'];
        
        // ASSETS
        const imgUrl = "nokia_blank.png";
        const fontUrl = "nokia_font_final.ttf";
        const fontName = "NokiaCustom";

        // STATE
        let currentQuote = "Press Generate Button";
        let currentAuthor = "";
        let bgImage = new Image();
        let isFontLoaded = false;

        // ELEMENTS
        const canvas = document.getElementById('memeCanvas');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');

        // 1. SETUP AWAL
        async function init() {
            // Load Font
            const font = new FontFace(fontName, `url(${fontUrl})`);
            try {
                await font.load();
                document.fonts.add(font);
                isFontLoaded = true;
                console.log("Font loaded!");
            } catch (e) {
                console.error("Font failed, using fallback", e);
            }

            // Load Image
            bgImage.src = imgUrl;
            bgImage.onload = () => {
                canvas.width = bgImage.width;
                canvas.height = bgImage.height;
                
                // Set slider max values
                document.getElementById('posX').max = canvas.width;
                document.getElementById('posY').max = canvas.height;
                document.getElementById('maxW').max = canvas.width;
                
                // Generate pertama kali
                generateQuote(); 
            };
        }

        // 2. FETCH DATA MENGGUNAKAN JQUERY AJAX (MODIFIED)
        function generateQuote() {
            // Tampilkan loading
            $('#loader').show();
            
            // Pilih kategori acak agar quote selalu beda
            const randomCategory = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];

            $.ajax({
                method: 'GET',
                url: API_URL,
                headers: { 'X-Api-Key': API_KEY },
                contentType: 'application/json',
                // Data dikirim sebagai parameter
                data: { category: randomCategory }, 
                success: function(result) {
                    // Log sukses
                    console.log("Data received:", result);
                    
                    if(result && result.length > 0) {
                        currentQuote = result[0].quote;
                        currentAuthor = "- " + result[0].author;
                        updateCanvas(); // Gambar ulang canvas
                    }
                    
                    $('#loader').hide();
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    console.error('Error:', textStatus, errorThrown);
                    currentQuote = "Error fetching quote.";
                    currentAuthor = "Check Console";
                    updateCanvas();
                    $('#loader').hide();
                }
            });
        }

        // 3. DRAWING LOGIC (Sama seperti sebelumnya)
        function updateCanvas() {
            if (!bgImage.complete) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, 0, 0);

            const x = parseInt($('#posX').val());
            const y = parseInt($('#posY').val());
            const lineHeight = parseInt($('#lineH').val());
            const fontSize = parseInt($('#fontS').val());
            const maxWidth = parseInt($('#maxW').val());

            // Update Label Angka
            $('#valX').text(x);
            $('#valY').text(y);
            $('#valLH').text(lineHeight);
            $('#valFS').text(fontSize);
            $('#valW').text(maxWidth);

            ctx.font = `${fontSize}px ${fontName}, monospace`;
            ctx.fillStyle = "#000000"; 
            ctx.textBaseline = "alphabetic";

            const fullText = currentQuote; 
            const words = fullText.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;

                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            
            currentY += lineHeight;
            ctx.fillText(currentAuthor, x, currentY);
        }

        // 4. DOWNLOAD
        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'nokia_quote.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        // Jalankan
        init();

    </script>
</body>
</html>
