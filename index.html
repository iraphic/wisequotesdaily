<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Generator (Fixed)</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-width: 900px;
            width: 100%;
            text-align: center;
            border: 1px solid #333;
        }

        h2 { margin-top: 0; color: #fff; }

        canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid #333;
            margin: 15px 0;
            border-radius: 4px;
            background: #000;
        }

        /* Area Input Manual */
        .manual-area {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
            text-align: left;
        }

        .manual-area label {
            color: #4CAF50;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        textarea, input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            background: #121212;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 10px;
            font-family: inherit;
        }

        textarea { height: 80px; resize: vertical; }

        .btn-apply {
            background: #4CAF50;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-apply:hover { background: #45a049; }

        /* Controls Slider */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .full-width { grid-column: span 2; }
        
        .slider-label { 
            font-size: 0.85rem; 
            color: #FFC107;
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold;
        }
        
        input[type="range"] { width: 100%; cursor: ew-resize; }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 1rem;
        }

        .btn-api { background: #2196F3; }
        .btn-api:hover { background: #1e88e5; }
        
        .btn-dl { background: #FF9800; }
        .btn-dl:hover { background: #fb8c00; }

        #status { margin-bottom: 10px; color: #888; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nokia Memo Creator</h2>
        <div id="status">Ready.</div>
        
        <canvas id="nokiaCanvas"></canvas>

        <div class="manual-area">
            <label>📝 Teks Quote</label>
            <textarea id="inputQuote" placeholder="Ketik kalimat di sini...">Menunggu Generate...</textarea>
            
            <label>👤 Author (Opsional)</label>
            <input type="text" id="inputAuthor" placeholder="Misal: Anonim">
            
            <button class="btn-apply" onclick="applyManualText()">✅ Terapkan Teks ke Layar</button>
        </div>

        <div class="controls">
            <div class="input-group">
                <label class="slider-label">Posisi Kiri (X): <span id="valX"></span></label>
                <input type="range" id="posX" min="0" max="500" value="300" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label class="slider-label">Posisi Atas (Y): <span id="valY"></span></label>
                <input type="range" id="posY" min="0" max="1000" value="636" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label class="slider-label">Jarak Baris (Line Height): <span id="valLH"></span></label>
                <input type="range" id="lineH" min="30" max="300" value="159" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label class="slider-label">Ukuran Font: <span id="valFS"></span></label>
                <input type="range" id="fontS" min="20" max="300" value="152" oninput="drawCanvas()">
            </div>

            <div class="input-group full-width">
                <label class="slider-label">Batas Kanan Teks: <span id="valW"></span></label>
                <input type="range" id="maxW" min="500" max="3000" value="1916" oninput="drawCanvas()">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-api" onclick="getSmartQuote()">🔄 Generate Random Quote</button>
            <button class="btn btn-dl" onclick="downloadImg()">💾 Download Gambar</button>
        </div>
    </div>

    <script>
        // CONFIG - Kita ganti API Ninja dengan yang lebih ramah CORS
        const API_URL = "https://dummyjson.com/quotes/random";
        
        // ASSETS
        const IMAGE_SRC = "nokia_blank.png";
        const FONT_FILE = "nokia_font_final.ttf";
        const FONT_NAME = "NokiaRetro";

        // DATABASE LOKAL (OFFLINE MODE)
        // Jika API gagal, quote diambil dari sini. Tambahkan sesuka hati.
        const LOCAL_DB = [
            { quote: "Whatever you do in life, just make sure at the end of the day you are happy.", author: "WiseQuotes" },
            { quote: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { quote: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
            { quote: "Get busy living or get busy dying.", author: "Stephen King" },
            { quote: "You only live once, but if you do it right, once is enough.", author: "Mae West" },
            { quote: "The purpose of our lives is to be happy.", author: "Dalai Lama" },
            { quote: "Sukses adalah berjalan dari satu kegagalan ke kegagalan lain tanpa kehilangan antusiasme.", author: "Winston Churchill" },
            { quote: "Jangan menunggu waktu yang tepat. Ciptakanlah.", author: "Anonim" }
        ];

        // GLOBAL VARS
        let canvas = document.getElementById('nokiaCanvas');
        let ctx = canvas.getContext('2d');
        let bgImg = new Image();
        
        let currentText = "";
        let currentAuthor = "";

        // --- INIT ---
        $(document).ready(function() {
            loadResources();
        });

        async function loadResources() {
            // 1. Load Font
            const font = new FontFace(FONT_NAME, `url(${FONT_FILE})`);
            try {
                await font.load();
                document.fonts.add(font);
            } catch (err) { console.warn("Font default used."); }

            // 2. Load Image
            bgImg.src = IMAGE_SRC;
            bgImg.onload = function() {
                canvas.width = bgImg.width;
                canvas.height = bgImg.height;
                
                // Set slider max values dinamis (tetap menghormati value HTML)
                if(bgImg.width > 500) $('#posX').attr('max', bgImg.width);
                if(bgImg.height > 1000) $('#posY').attr('max', bgImg.height);
                if(bgImg.width > 1916) $('#maxW').attr('max', bgImg.width);

                // Start
                getSmartQuote(); 
            };
        }

        // --- HYBRID FETCH SYSTEM (API + LOCAL) ---
        function getSmartQuote() {
            $('#status').text("Mengambil data...");

            // Coba ambil dari DummyJSON (Lebih stabil & Bebas CORS)
            $.ajax({
                method: 'GET',
                url: API_URL,
                timeout: 3000, // Jika 3 detik loading, langsung switch ke lokal
                success: function(result) {
                    // Jika sukses ambil dari internet
                    updateInputAndCanvas(result.quote, result.author);
                    $('#status').text("Sumber: Internet (DummyJSON)");
                },
                error: function() {
                    // Jika GAGAL/Offline -> Ambil dari LOCAL_DB
                    console.log("Internet gagal, menggunakan database lokal.");
                    const randomPick = LOCAL_DB[Math.floor(Math.random() * LOCAL_DB.length)];
                    updateInputAndCanvas(randomPick.quote, randomPick.author);
                    $('#status').text("Sumber: Database Lokal (Offline Mode)");
                }
            });
        }

        function updateInputAndCanvas(text, author) {
            $('#inputQuote').val(text);
            $('#inputAuthor').val(author);
            applyManualText();
        }

        // --- MANUAL INPUT HANDLER ---
        function applyManualText() {
            const rawText = $('#inputQuote').val();
            const rawAuthor = $('#inputAuthor').val();

            if (!rawText) return;

            currentText = rawText;
            currentAuthor = rawAuthor ? "- " + rawAuthor : "";

            drawCanvas();
        }

        // --- LOGIC GAMBAR CANVAS ---
        function drawCanvas() {
            if (!bgImg.complete) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0);

            // Ambil Slider Values
            const x = parseInt($('#posX').val());
            const y = parseInt($('#posY').val());
            const lh = parseInt($('#lineH').val());
            const fs = parseInt($('#fontS').val());
            const maxW = parseInt($('#maxW').val());

            // Update Angka di Label
            $('#valX').text(x);
            $('#valY').text(y);
            $('#valLH').text(lh);
            $('#valFS').text(fs);
            $('#valW').text(maxW);

            // Setting Font
            ctx.font = `${fs}px ${FONT_NAME}, monospace`;
            ctx.fillStyle = "#181818"; 
            ctx.textBaseline = "alphabetic"; 

            const words = currentText.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                
                if (metrics.width > maxW && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lh;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            
            if (currentAuthor !== "") {
                currentY += lh; 
                ctx.fillText(currentAuthor, x, currentY);
            }
        }

        function downloadImg() {
            const link = document.createElement('a');
            link.download = `nokia_memo_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
