<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Generator Final</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 800px; /* Lebar container diperbesar */
            width: 100%;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid #444;
            margin: 15px 0;
            border-radius: 4px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
            background: #333;
            padding: 15px;
            border-radius: 8px;
        }

        .full-width { grid-column: span 2; }
        
        label { 
            font-size: 0.85rem; 
            color: #ffd700; /* Warna label kuning biar jelas */
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold;
        }
        
        input[type="range"] { width: 100%; cursor: ew-resize; }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        .btn-gen { background: #007bff; color: white; }
        .btn-gen:hover { background: #0056b3; }
        
        .btn-dl { background: #28a745; color: white; }
        .btn-dl:hover { background: #1e7e34; }

        #status { margin-bottom: 10px; color: #aaa; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nokia Memo Generator</h2>
        <div id="status">Siap generate...</div>
        
        <canvas id="nokiaCanvas"></canvas>

        <div class="controls">
            <div class="input-group">
                <label>Posisi Kiri (X): <span id="valX"></span></label>
                <input type="range" id="posX" min="0" max="300" value="229" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label>Posisi Atas (Y): <span id="valY"></span></label>
                <input type="range" id="posY" min="0" max="700" value="641" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label>Jarak Baris (Line Height): <span id="valLH"></span></label>
                <input type="range" id="lineH" min="30" max="100" value="59" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label>Ukuran Font: <span id="valFS"></span></label>
                <input type="range" id="fontS" min="20" max="300" value="102" oninput="drawCanvas()">
            </div>

            <div class="input-group full-width">
                <label>Batas Kanan Teks: <span id="valW"></span></label>
                <input type="range" id="maxW" min="500" max="1200" value="940" oninput="drawCanvas()">
            </div>

            <div class="full-width" style="display:flex; gap:10px;">
                <button class="btn-gen" onclick="getQuote()">🔄 Generate Quote</button>
                <button class="btn-dl" onclick="downloadImg()">💾 Download</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const API_KEY = "9zAnv7rg3z+Re3XeiyrFjg==DQRDaDt5Ln0kQm7w";
        const API_URL = "https://api.api-ninjas.com/v1/quotes"; 
        
        // ASSETS
        const IMAGE_SRC = "nokia_blank.png";
        const FONT_FILE = "nokia_font_final.ttf";
        const FONT_NAME = "NokiaRetro";

        // VARIABLES
        let canvas = document.getElementById('nokiaCanvas');
        let ctx = canvas.getContext('2d');
        let bgImg = new Image();
        let currentText = "Tekan Generate untuk memulai...";
        let currentAuthor = "";

        // INIT
        $(document).ready(function() {
            loadResources();
        });

        async function loadResources() {
            // Load Font
            const font = new FontFace(FONT_NAME, `url(${FONT_FILE})`);
            try {
                await font.load();
                document.fonts.add(font);
            } catch (err) { console.warn("Font default used."); }

            // Load Image
            bgImg.src = IMAGE_SRC;
            bgImg.onload = function() {
                canvas.width = bgImg.width;
                canvas.height = bgImg.height;
                
                // Update slider max values dynamically
                $('#posX').attr('max', bgImg.width);
                $('#posY').attr('max', bgImg.height);
                $('#maxW').attr('max', bgImg.width);

                getQuote(); // Auto start
            };
        }

        // FETCH API
        function getQuote() {
            $('#status').text("Loading data...");
            const cats = ['success', 'life', 'wisdom', 'happiness'];
            const randomCat = cats[Math.floor(Math.random() * cats.length)];

            $.ajax({
                method: 'GET',
                url: API_URL,
                headers: { 'X-Api-Key': API_KEY },
                data: { category: randomCat },
                success: function(result) {
                    if (result && result.length > 0) {
                        currentText = result[0].quote;
                        currentAuthor = "- " + result[0].author;
                        $('#status').text("Quote Loaded!");
                        drawCanvas();
                    }
                },
                error: function() {
                    $('#status').text("API Error. Coba lagi.");
                }
            });
        }

        // RENDER CANVAS
        function drawCanvas() {
            if (!bgImg.complete) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0);

            // Get Values
            const x = parseInt($('#posX').val());
            const y = parseInt($('#posY').val());
            const lh = parseInt($('#lineH').val());
            const fs = parseInt($('#fontS').val());
            const maxW = parseInt($('#maxW').val());

            // Update Labels
            $('#valX').text(x);
            $('#valY').text(y);
            $('#valLH').text(lh);
            $('#valFS').text(fs);
            $('#valW').text(maxW);

            // Font Settings
            ctx.font = `${fs}px ${FONT_NAME}, monospace`;
            ctx.fillStyle = "#181818"; // Hitam pekat tapi tidak 100% (sedikit soft)
            ctx.textBaseline = "alphabetic"; 

            // Logic Wrapping
            const words = currentText.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxW && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lh;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            
            // Opsional: Author (bisa di-uncomment jika mau ditampilkan)
            // currentY += lh;
            // ctx.fillText(currentAuthor, x, currentY);
        }

        function downloadImg() {
            const link = document.createElement('a');
            link.download = `nokia_quote_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
