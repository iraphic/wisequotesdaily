<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Memo Generator</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-width: 900px;
            width: 100%;
            text-align: center;
            border: 1px solid #333;
        }

        h2 { margin-top: 0; color: #fff; }

        canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid #333;
            margin: 15px 0;
            border-radius: 4px;
            background: #000;
        }

        .manual-area {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
            text-align: left;
        }

        .manual-area label {
            color: #4CAF50;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            background: #121212;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 10px;
            font-family: inherit;
            height: 100px; 
            resize: vertical;
        }

        .btn-apply {
            background: #4CAF50;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-apply:hover { background: #45a049; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .full-width { grid-column: span 2; }
        
        .slider-label { 
            font-size: 0.85rem; 
            color: #FFC107;
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold;
        }
        
        input[type="range"] { width: 100%; cursor: ew-resize; }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 1rem;
        }

        .btn-api { background: #2196F3; }
        .btn-api:hover { background: #1e88e5; }
        
        .btn-dl { background: #FF9800; }
        .btn-dl:hover { background: #fb8c00; }

        #status { margin-bottom: 10px; color: #888; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nokia Memo Creator (Natural Look)</h2>
        <div id="status">Ready.</div>
        
        <canvas id="nokiaCanvas"></canvas>

        <div class="manual-area">
            <label>📝 Teks Quote</label>
            <textarea id="inputQuote" placeholder="Ketik kalimat di sini...">Menunggu Generate...</textarea>
            <button class="btn-apply" onclick="applyManualText()">✅ Terapkan Teks</button>
        </div>

        <div class="controls">
            <div class="input-group">
                <label class="slider-label">Posisi Kiri (X): <span id="valX"></span></label>
                <input type="range" id="posX" min="0" max="500" value="257" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label class="slider-label">Posisi Atas (Y): <span id="valY"></span></label>
                <input type="range" id="posY" min="0" max="1000" value="636" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label class="slider-label">Rotasi Teks (Derajat): <span id="valRot"></span>°</label>
                <input type="range" id="rot" min="-10" max="10" value="0.5" step="0.5" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label class="slider-label">Jarak Baris (Line Height): <span id="valLH"></span></label>
                <input type="range" id="lineH" min="30" max="300" value="152" oninput="drawCanvas()">
            </div>

            <div class="input-group">
                <label class="slider-label">Ukuran Font: <span id="valFS"></span></label>
                <input type="range" id="fontS" min="20" max="300" value="152" oninput="drawCanvas()">
            </div>

            <div class="input-group full-width">
                <label class="slider-label">Batas Kanan Teks: <span id="valW"></span></label>
                <input type="range" id="maxW" min="500" max="3000" value="1916" oninput="drawCanvas()">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-api" onclick="getSmartQuote()">🔄 Generate Quote</button>
            <button class="btn btn-dl" onclick="downloadImg()">💾 Download Gambar</button>
        </div>
    </div>

    <script>
        // CONFIG
        const API_URL = "https://dummyjson.com/quotes/random";
        const IMAGE_SRC = "nokia_blank.png";
        const FONT_FILE = "nokia_font_final.ttf";
        const FONT_NAME = "NokiaRetro";

        // DATABASE LOKAL
        const LOCAL_DB = [
            "Whatever you do in life, just make sure at the end of the day you are happy.",
            "The only way to do great work is to love what you do.",
            "Life is what happens when you're busy making other plans.",
            "Get busy living or get busy dying.",
            "You only live once, but if you do it right, once is enough.",
            "The purpose of our lives is to be happy.",
            "Sukses adalah berjalan dari satu kegagalan ke kegagalan lain tanpa kehilangan antusiasme.",
            "Jangan menunggu waktu yang tepat. Ciptakanlah."
        ];

        // GLOBAL VARS
        let canvas = document.getElementById('nokiaCanvas');
        let ctx = canvas.getContext('2d');
        let bgImg = new Image();
        
        let currentText = "";

        // --- INIT ---
        $(document).ready(function() {
            loadResources();
        });

        async function loadResources() {
            const font = new FontFace(FONT_NAME, `url(${FONT_FILE})`);
            try {
                await font.load();
                document.fonts.add(font);
            } catch (err) { console.warn("Font default used."); }

            bgImg.src = IMAGE_SRC;
            bgImg.onload = function() {
                canvas.width = bgImg.width;
                canvas.height = bgImg.height;
                
                // Update Max Values Slider
                if(bgImg.width > 500) $('#posX').attr('max', bgImg.width);
                if(bgImg.height > 1000) $('#posY').attr('max', bgImg.height);
                if(bgImg.width > 1916) $('#maxW').attr('max', bgImg.width);

                getSmartQuote(); 
            };
        }

        // --- FETCH SYSTEM ---
        function getSmartQuote() {
            $('#status').text("Mengambil data...");
            $.ajax({
                method: 'GET', url: API_URL, timeout: 3000,
                success: function(result) {
                    updateInputAndCanvas(result.quote);
                    $('#status').text("Sumber: Internet");
                },
                error: function() {
                    const randomPick = LOCAL_DB[Math.floor(Math.random() * LOCAL_DB.length)];
                    updateInputAndCanvas(randomPick);
                    $('#status').text("Sumber: Offline Mode");
                }
            });
        }

        function updateInputAndCanvas(text) {
            $('#inputQuote').val(text);
            applyManualText();
        }

        function applyManualText() {
            const rawText = $('#inputQuote').val();
            if (!rawText) return;
            currentText = rawText;
            drawCanvas();
        }

        // --- DRAWING LOGIC (DENGAN ROTASI) ---
        function drawCanvas() {
            if (!bgImg.complete) return;

            // 1. Gambar Background (Lurus)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0);

            // Ambil Slider Values
            const x = parseInt($('#posX').val());
            const y = parseInt($('#posY').val());
            const lh = parseInt($('#lineH').val());
            const fs = parseInt($('#fontS').val());
            const maxW = parseInt($('#maxW').val());
            // Ambil nilai rotasi (float karena ada koma)
            const rot = parseFloat($('#rot').val()); 

            // Update Labels
            $('#valX').text(x);
            $('#valY').text(y);
            $('#valLH').text(lh);
            $('#valFS').text(fs);
            $('#valW').text(maxW);
            $('#valRot').text(rot); // Update label rotasi

            // Setting Font
            ctx.font = `${fs}px ${FONT_NAME}, monospace`;
            ctx.fillStyle = "#181818"; 
            ctx.textBaseline = "alphabetic"; 

            // --- LOGIKA ROTASI ---
            ctx.save(); // Simpan status canvas normal
            
            // 1. Pindahkan titik pusat (pivot) ke koordinat awal teks (x, y)
            ctx.translate(x, y);
            
            // 2. Putar canvas sesuai derajat yang diminta (ubah ke radian)
            ctx.rotate(rot * Math.PI / 180);

            // --- LOGIKA WRAPPING & GAMBAR TEKS ---
            const words = currentText.split(' ');
            let line = '';
            // Kita mulai menggambar dari titik (0, 0) relatif terhadap titik pusat baru
            let relativeY = 0; 

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                
                if (metrics.width > maxW && n > 0) {
                    // Gambar di koordinat relatif (0, relativeY)
                    ctx.fillText(line, 0, relativeY);
                    line = words[n] + ' ';
                    relativeY += lh;
                } else {
                    line = testLine;
                }
            }
            // Gambar baris terakhir
            ctx.fillText(line, 0, relativeY);

            ctx.restore(); // Kembalikan status canvas agar gambar lain tidak ikut miring
        }

        function downloadImg() {
            const link = document.createElement('a');
            link.download = `nokia_quote_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
