<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Memo Generator</title>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h2 { margin-bottom: 10px; }
        
        /* Container Canvas */
        .canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #555;
            margin-bottom: 20px;
            /* Agar canvas responsif tapi tetap terjaga rasionya */
            max-width: 100%; 
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* Controls */
        .controls {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 kolom */
            gap: 15px;
        }
        
        .full-width { grid-column: span 2; }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        label { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        
        input[type="range"] { width: 100%; cursor: pointer; }
        
        button {
            padding: 12px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-gen { background: #008CBA; color: white; }
        .btn-dl { background: #4CAF50; color: white; }
        .btn-gen:hover { background: #007399; }
        
        /* Loading Indicator */
        #loader {
            display: none;
            color: #ffff00;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h2>Nokia Memo Generator</h2>
    <div id="loader">Sedang mengambil quote...</div>

    <div class="canvas-container">
        <canvas id="memeCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="full-width">
            <button class="btn-gen" onclick="generateQuote()">🔄 Generate New Quote</button>
        </div>

        <div class="input-group">
            <label>Posisi Kiri/Kanan (X): <span id="valX">0</span></label>
            <input type="range" id="posX" min="0" max="500" value="25" oninput="updateCanvas()">
        </div>

        <div class="input-group">
            <label>Posisi Atas/Bawah (Y): <span id="valY">0</span></label>
            <input type="range" id="posY" min="0" max="500" value="285" oninput="updateCanvas()">
        </div>

        <div class="input-group">
            <label>Jarak Antar Baris (Line Height): <span id="valLH">0</span></label>
            <input type="range" id="lineH" min="10" max="100" value="56" oninput="updateCanvas()">
        </div>

        <div class="input-group">
            <label>Ukuran Font: <span id="valFS">0</span></label>
            <input type="range" id="fontS" min="10" max="60" value="34" oninput="updateCanvas()">
        </div>
        
        <div class="input-group full-width">
            <label>Lebar Teks (Wrap Width): <span id="valW">0</span></label>
            <input type="range" id="maxW" min="100" max="1000" value="950" oninput="updateCanvas()">
        </div>

        <div class="full-width">
            <button class="btn-dl" onclick="downloadImage()">💾 Download Image</button>
        </div>
    </div>

    <script>
        // CONFIG
        const API_KEY = "9zAnv7rg3z+Re3XeiyrFjg==DQRDaDt5Ln0kQm7w";
        const API_URL = "https://api.api-ninjas.com/v1/quotes";
        const CATEGORIES = ['success', 'wisdom', 'life', 'inspirational', 'happiness', 'future'];
        
        // ASSETS
        const imgUrl = "nokia_blank.png";
        const fontUrl = "nokia_font_final.ttf";
        const fontName = "NokiaCustom";

        // STATE
        let currentQuote = "Loading...";
        let currentAuthor = "";
        let bgImage = new Image();
        let isFontLoaded = false;

        // ELEMENTS
        const canvas = document.getElementById('memeCanvas');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');

        // 1. SETUP AWAL
        async function init() {
            // Load Font
            const font = new FontFace(fontName, `url(${fontUrl})`);
            try {
                await font.load();
                document.fonts.add(font);
                isFontLoaded = true;
                console.log("Font loaded!");
            } catch (e) {
                console.error("Font failed, using fallback", e);
            }

            // Load Image
            bgImage.src = imgUrl;
            bgImage.onload = () => {
                canvas.width = bgImage.width;
                canvas.height = bgImage.height;
                
                // Set default slider max values based on image size
                document.getElementById('posX').max = canvas.width;
                document.getElementById('posY').max = canvas.height;
                document.getElementById('maxW').max = canvas.width;
                
                generateQuote(); // Start first quote
            };
        }

        // 2. FETCH DATA
        async function generateQuote() {
            loader.style.display = 'block';
            const category = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
            
            try {
                const response = await fetch(`${API_URL}?category=${category}`, {
                    headers: { 'X-Api-Key': API_KEY }
                });
                const data = await response.json();
                
                if (data && data.length > 0) {
                    currentQuote = data[0].quote;
                    currentAuthor = "- " + data[0].author;
                } else {
                    currentQuote = "Failed to fetch quote.";
                    currentAuthor = "";
                }
            } catch (err) {
                console.error(err);
                currentQuote = "Network Error. Check Console.";
                currentAuthor = "";
            } finally {
                loader.style.display = 'none';
                updateCanvas();
            }
        }

        // 3. DRAWING LOGIC (Inti Program)
        function updateCanvas() {
            if (!bgImage.complete) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw Background
            ctx.drawImage(bgImage, 0, 0);

            // Get Settings from Sliders
            const x = parseInt(document.getElementById('posX').value);
            const y = parseInt(document.getElementById('posY').value);
            const lineHeight = parseInt(document.getElementById('lineH').value);
            const fontSize = parseInt(document.getElementById('fontS').value);
            const maxWidth = parseInt(document.getElementById('maxW').value);

            // Update UI Labels
            document.getElementById('valX').textContent = x;
            document.getElementById('valY').textContent = y;
            document.getElementById('valLH').textContent = lineHeight;
            document.getElementById('valFS').textContent = fontSize;
            document.getElementById('valW').textContent = maxWidth;

            // Font Settings
            ctx.font = `${fontSize}px ${fontName}, monospace`;
            ctx.fillStyle = "#000000"; // Text color black
            ctx.textBaseline = "alphabetic"; // Penting agar pas di garis

            // Gabungkan Quote dan Author untuk proses wrapping
            // (Opsional: Author mau di baris baru atau nyambung)
            const fullText = currentQuote; 

            // Text Wrapping Logic
            const words = fullText.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;

                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            // Draw last line of quote
            ctx.fillText(line, x, currentY);
            
            // Draw Author on next line
            currentY += lineHeight;
            ctx.fillText(currentAuthor, x, currentY);
        }

        // 4. DOWNLOAD
        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'nokia_quote.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        // Jalankan
        init();

    </script>
</body>
</html>
