<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Lowongan Sederhana</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @font-face {
            font-family: 'HelveticaCustom';
            src: url('Helvetica.ttf') format('truetype');
        }
        @font-face {
            font-family: 'CoolveticaCustom';
            src: url('coolvetica rg.ttf') format('truetype');
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generator Poster Lowongan</h1>

        <div class="controls" style="margin-bottom: 1rem;">
            <input id="posisi" class="btn" placeholder="Posisi (contoh: DRAFTER)" />
            <input id="lokasi" class="btn" placeholder="Lokasi (contoh: DKI Jakarta)" />
            <input id="perusahaan" class="btn" placeholder="Nama Perusahaan" />
            <input id="ajakan" class="btn" placeholder="Ajakan (contoh: Yuk kirim CV...)" />
            <input id="email" class="btn" placeholder="Email/Kontak" />
        </div>

        <details style="margin-bottom: 1rem; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px;">
            <summary style="cursor: pointer; font-weight: bold; margin-bottom: 10px;">Pengaturan Posisi & Ukuran Font</summary>
            
            <div class="setting-group">
                <label><b>Posisi (Jabatan)</b></label>
                <div class="slider-row">
                    <label>Size:</label> 
                    <input type="range" id="s_posisi_size" min="50" max="200" value="107">
                    <input type="number" id="n_posisi_size" value="107" min="50" max="200" style="width: 60px;">
                </div>
                <div class="slider-row">
                    <label>Y-Pos:</label> 
                    <input type="range" id="s_posisi_y" min="10" max="90" value="33">
                    <input type="number" id="n_posisi_y" value="33" min="10" max="90" style="width: 60px;">
                </div>
            </div>

            <div class="setting-group">
                <label><b>Lokasi</b></label>
                <div class="slider-row">
                    <label>Size:</label> 
                    <input type="range" id="s_lokasi_size" min="20" max="100" value="50">
                    <input type="number" id="n_lokasi_size" value="50" min="20" max="100" style="width: 60px;">
                </div>
                <div class="slider-row">
                    <label>Y-Pos:</label> 
                    <input type="range" id="s_lokasi_y" min="10" max="90" value="42">
                    <input type="number" id="n_lokasi_y" value="42" min="10" max="90" style="width: 60px;">
                </div>
            </div>

            <div class="setting-group">
                <label><b>Perusahaan</b></label>
                <div class="slider-row">
                    <label>Size:</label> 
                    <input type="range" id="s_perusahaan_size" min="20" max="100" value="55">
                    <input type="number" id="n_perusahaan_size" value="55" min="20" max="100" style="width: 60px;">
                </div>
                <div class="slider-row">
                    <label>Y-Pos:</label> 
                    <input type="range" id="s_perusahaan_y" min="10" max="90" value="57">
                    <input type="number" id="n_perusahaan_y" value="57" min="10" max="90" style="width: 60px;">
                </div>
            </div>

            <div class="setting-group">
                <label><b>Footer (Ajakan/Email)</b></label>
                <div class="slider-row">
                    <label>Size:</label> 
                    <input type="range" id="s_footer_size" min="10" max="80" value="51">
                    <input type="number" id="n_footer_size" value="51" min="10" max="80" style="width: 60px;">
                </div>
                <div class="slider-row">
                    <label>Y-Pos:</label> 
                    <input type="range" id="s_footer_y" min="10" max="90" value="74">
                    <input type="number" id="n_footer_y" value="74" min="10" max="90" style="width: 60px;">
                </div>
            </div>
        </details>

        <div class="canvas-wrapper">
            <canvas id="posterCanvas"></canvas>
        </div>

        <div class="controls">
            <button id="btnGenerate" class="btn retro-btn">Buat Poster</button>
            <button id="btnDownload" class="btn retro-btn-secondary">Download Poster</button>
        </div>

          
        <div class="footer">
            <p>Pastikan file <b>template.png</b> ada di folder yang sama.</p>
           <details style="margin-bottom: 1rem; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px;">
            <p style="font-size: 0.9em; margin-top: 5px;">Jika tombol download tidak berfungsi (gagal), coba pilih gambar background secara manual di bawah ini:</p>
            <input type="file" id="bgInput" accept="image/*" style="margin-top: 5px;">
        </details></div>
        
    </div>

        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');

        // Handle File Upload for Background
        document.getElementById('bgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentTemplateSrc = event.target.result;
                    document.getElementById('btnGenerate').click(); // Redraw
                };
                reader.readAsDataURL(file);
            }
        });

        function getLines(ctx, text, maxWidth) {
            const words = (text || '').split(' ');
            const lines = [];
            let line = words[0] || '';
            for (let i = 1; i < words.length; i++) {
                const test = line + ' ' + words[i];
                if (ctx.measureText(test).width < maxWidth) {
                    line = test;
                } else {
                    lines.push(line);
                    line = words[i];
                }
            }
            if (line) lines.push(line);
            return lines;
        }

        function drawPoster(data) {
            const img = new Image();
            img.src = currentTemplateSrc;

            // Get Settings
            const settings = {
                posisi: { size: parseInt(document.getElementById('s_posisi_size').value), y: parseInt(document.getElementById('s_posisi_y').value) / 100 },
                lokasi: { size: parseInt(document.getElementById('s_lokasi_size').value), y: parseInt(document.getElementById('s_lokasi_y').value) / 100 },
                perusahaan: { size: parseInt(document.getElementById('s_perusahaan_size').value), y: parseInt(document.getElementById('s_perusahaan_y').value) / 100 },
                footer: { size: parseInt(document.getElementById('s_footer_size').value), y: parseInt(document.getElementById('s_footer_y').value) / 100 }
            };

            img.onload = () => {
                // Set canvas size to match image
                canvas.width = img.width;
                canvas.height = img.height;

                // Base scale relative to 1080px width
                const baseScale = (canvas.width / 1080);

                // 1. Draw Background
                ctx.drawImage(img, 0, 0);

                // 2. Setup Text Styles
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';

                // Center X coordinate
                const cx = canvas.width / 2;

                // --- POSISI (JABATAN) ---
                // Font Besar, Bold, Shadow
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 4;
                ctx.font = `bold ${settings.posisi.size * baseScale}px "HelveticaCustom", "Helvetica", Arial, sans-serif`; 
                const yPosisi = canvas.height * settings.posisi.y; 
                ctx.fillText((data.posisi || '').toUpperCase(), cx, yPosisi);
                ctx.restore();

                // --- LOKASI ---
                // Font Sedang, Bold
                ctx.font = `bold ${settings.lokasi.size * baseScale}px "HelveticaCustom", "Helvetica", Arial, sans-serif`;
                const yLokasi = canvas.height * settings.lokasi.y;
                ctx.fillText((data.lokasi || ''), cx, yLokasi);

                // --- PERUSAHAAN ---
                // Font Besar tapi lebih kecil dari Posisi
                ctx.font = `bold ${settings.perusahaan.size * baseScale}px "HelveticaCustom", "Helvetica", Arial, sans-serif`;
                const yPerusahaan = canvas.height * settings.perusahaan.y;
                const perusahaanLines = getLines(ctx, data.perusahaan || '', canvas.width * 0.9);
                perusahaanLines.forEach((line, i) => {
                    ctx.fillText(line, cx, yPerusahaan + (i * (settings.perusahaan.size * 1.2) * baseScale));
                });

                // --- AJAKAN & EMAIL ---
                // Font Kecil
                ctx.font = `${settings.footer.size * baseScale}px "CoolveticaCustom", "Coolvetica", Arial, sans-serif`;
                const yFooter = canvas.height * settings.footer.y; 
                // Gabung ajakan dan email atau pisah baris
                const ajakanText = data.ajakan || '';
                const emailText = data.email || '';
                
                ctx.fillText(ajakanText, cx, yFooter);
                ctx.fillText(emailText, cx, yFooter + ((settings.footer.size * 1.3) * baseScale));
            };

            img.onerror = () => {
                // Fallback jika gambar tidak ditemukan
                canvas.width = 1080;
                canvas.height = 1080;
                ctx.fillStyle = '#2b7a78';
                ctx.fillRect(0, 0, 1080, 1080);
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('File template.png tidak ditemukan!', 540, 540);
                ctx.font = '24px Arial';
                ctx.fillText('Simpan gambar background sebagai template.png', 540, 590);
            };
        }

        function downloadImage() {
            try {
                const link = document.createElement('a');
                link.download = 'poster-lowongan.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (e) {
                alert("Gagal mengunduh gambar. Ini biasanya terjadi karena keamanan browser saat membuka file HTML langsung (Tainted Canvas).\n\nSolusi: Silakan pilih file 'template.png' menggunakan tombol 'Choose File' di bagian bawah halaman, lalu coba download lagi.");
                console.error(e);
            }
        }

        document.getElementById('btnGenerate').addEventListener('click', () => {
            const data = {
                posisi: document.getElementById('posisi').value,
                lokasi: document.getElementById('lokasi').value,
                perusahaan: document.getElementById('perusahaan').value,
                ajakan: document.getElementById('ajakan').value,
                email: document.getElementById('email').value
            };
            drawPoster(data);
        });

        document.getElementById('btnDownload').addEventListener('click', downloadImage);

        // Attach listeners to all sliders and inputs
        const settingKeys = [
            { slider: 's_posisi_size', number: 'n_posisi_size' },
            { slider: 's_posisi_y', number: 'n_posisi_y' },
            { slider: 's_lokasi_size', number: 'n_lokasi_size' },
            { slider: 's_lokasi_y', number: 'n_lokasi_y' },
            { slider: 's_perusahaan_size', number: 'n_perusahaan_size' },
            { slider: 's_perusahaan_y', number: 'n_perusahaan_y' },
            { slider: 's_footer_size', number: 'n_footer_size' },
            { slider: 's_footer_y', number: 'n_footer_y' }
        ];

        settingKeys.forEach(pair => {
            const slider = document.getElementById(pair.slider);
            const number = document.getElementById(pair.number);

            // Slider -> Number & Draw
            slider.addEventListener('input', () => {
                number.value = slider.value;
                document.getElementById('btnGenerate').click();
            });

            // Number -> Slider & Draw
            number.addEventListener('input', () => {
                slider.value = number.value;
                document.getElementById('btnGenerate').click();
            });
        });

        // Init dengan data dummy sesuai contoh
        window.addEventListener('load', () => {
            const defaultData = {
                posisi: 'DRAFTER',
                lokasi: 'DKI Jakarta',
                perusahaan: 'PT. Sarana Multidimensi Indonesia',
                ajakan: 'Yuk kirim CV dan Portofolio ke',
                email: 'info@smiofficial.com'
            };
            
            // Isi input field
            document.getElementById('posisi').value = defaultData.posisi;
            document.getElementById('lokasi').value = defaultData.lokasi;
            document.getElementById('perusahaan').value = defaultData.perusahaan;
            document.getElementById('ajakan').value = defaultData.ajakan;
            document.getElementById('email').value = defaultData.email;

            // Pastikan font sudah terload sebelum menggambar pertama kali
            document.fonts.ready.then(() => {
                drawPoster(defaultData);
            });
        });
    </script>
</body>
</html>
